<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VROMLIX | Mis Apuntes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: hsl(230, 20%, 6%);
            --bg-card: hsla(230, 20%, 12%, 0.45);
            --bg-card-hover: hsla(230, 20%, 16%, 0.6);
            --border-color: hsla(230, 20%, 30%, 0.15);
            --border-hover: hsla(230, 20%, 50%, 0.3);
            --accent-primary: hsl(190, 100%, 50%); /* Neon Cyan */
            --accent-secondary: hsl(270, 95%, 65%); /* Neon Purple */
            --accent-success: hsl(145, 80%, 45%); /* Emerald Green */
            
            --font-sans: 'Outfit', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --grad-text: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            --grad-glow: radial-gradient(circle at 50% -20%, hsla(190, 100%, 50%, 0.15), transparent 70%);
            
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: var(--grad-glow);
            background-attachment: fixed;
            color: hsl(220, 15%, 85%);
            font-family: var(--font-sans);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 80px;
        }

        .app-container {
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: var(--grad-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .subtitle {
            font-size: 0.85rem;
            color: hsl(220, 10%, 60%);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Buscador */
        .search-wrapper {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 12px 18px;
            font-size: 0.95rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: hsla(230, 20%, 10%, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: #fff;
            outline: none;
            transition: var(--transition-normal);
        }

        .search-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 12px hsla(190, 100%, 50%, 0.15);
        }

        /* Contenedor Fijo para Navegación Móvil y Desktop */
        .sticky-header-container {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-dark);
            padding-top: 10px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            margin-left: -20px;
            margin-right: -20px;
            padding-left: 20px;
            padding-right: 20px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            margin-bottom: 20px;
        }

        /* Selector de Clases (Tabs Horizontales con Scrollbar Oculto) */
        .tabs-container {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding-bottom: 12px;
            margin-bottom: 0;
            scrollbar-width: none; /* Firefox */
        }

        .tabs-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        @media (min-width: 600px) {
            .tabs-container {
                flex-wrap: wrap;
                overflow-x: visible;
            }
        }

        .tab-btn {
            flex: 0 0 auto;
            padding: 10px 18px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: hsl(220, 10%, 75%);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-normal);
        }

        .tab-btn:active {
            transform: scale(0.97);
        }

        .tab-btn.active {
            background: var(--grad-text);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 15px hsla(270, 95%, 65%, 0.25);
        }

        /* Contenido de la Clase Activa */
        .class-content-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Tarjeta de Tema (Card) */
        .topic-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: var(--transition-normal);
        }

        .topic-card.general-info {
            background: linear-gradient(135deg, hsla(190, 100%, 50%, 0.05), hsla(270, 95%, 65%, 0.03));
            border-color: hsla(190, 100%, 50%, 0.15);
        }

        .card-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .card-title {
            font-size: 1.12rem;
            font-weight: 600;
            color: hsl(220, 15%, 95%);
            transition: var(--transition-normal);
        }

        .topic-card.expanded .card-title {
            color: var(--accent-primary);
        }

        .chevron {
            width: 16px;
            height: 16px;
            color: hsl(220, 10%, 50%);
            transition: transform var(--transition-normal);
        }

        .topic-card.expanded .chevron {
            transform: rotate(180deg);
            color: var(--accent-primary);
        }

        .card-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height var(--transition-normal);
        }

        .card-content {
            padding: 0 20px 20px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 15px;
            font-size: 1.05rem;
            color: hsl(220, 10%, 92%);
        }

        /* Estilos Markdown Parseado */
        .card-content h3 {
            font-size: 1.15rem;
            margin-bottom: 10px;
            color: var(--accent-primary);
            border-left: 3px solid var(--accent-primary);
            padding-left: 10px;
            margin-top: 18px;
        }

        .card-content h3:first-child {
            margin-top: 0;
        }

        .card-content li,
        .card-content .list-item-numbered {
            margin-left: 20px;
            margin-bottom: 6px;
            font-size: 1.05rem;
            color: hsl(220, 10%, 92%);
            line-height: 1.5;
        }

        .card-content strong {
            color: #fff;
        }

        .card-content a {
            color: var(--accent-primary);
            text-decoration: none;
            border-bottom: 1px dotted var(--accent-primary);
        }

        /* Checkbox */
        .checkbox-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 1.05rem;
            line-height: 1.5;
        }

        .checkbox-item input[type="checkbox"] {
            margin-top: 5px;
            accent-color: var(--accent-primary);
            width: 16px;
            height: 16px;
        }

        .checkbox-item span {
            color: hsl(220, 10%, 92%);
        }

        .checkbox-item input[type="checkbox"]:checked + span {
            text-decoration: line-through;
            color: hsl(220, 10%, 50%);
        }

        /* Estilos para detalles colapsables (details/summary) */
        details {
            background: hsla(230, 20%, 15%, 0.3);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            margin: 8px 0;
            transition: var(--transition-normal);
        }

        details[open] {
            border-color: hsla(190, 100%, 50%, 0.3);
            background: hsla(230, 20%, 18%, 0.4);
        }

        summary {
            font-weight: 600;
            color: hsl(220, 15%, 95%);
            cursor: pointer;
            outline: none;
            user-select: none;
            transition: var(--transition-normal);
        }

        summary:hover {
            color: var(--accent-primary);
        }

        details p {
            margin-top: 10px;
            font-size: 0.95rem;
            color: hsl(220, 10%, 80%);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: hsl(220, 10%, 50%);
            font-size: 0.95rem;
            display: none;
        }

        .footer-info {
            text-align: center;
            font-size: 0.75rem;
            color: hsl(220, 10%, 40%);
            margin-top: 40px;
        }
    </style>
</head>

        const classesData = [{"title": "Escuela Dominical", "body": "*(Domingos 11:00 am — Capilla / Salón de Escuela Dominical)*\n\n### 📌 Anuncio Oficial y Ajustes 2026 (Mensaje del Hno. Paul Leyva — 31 de Agosto de 2026)\n* **Instrucción de la Primera Presidencia / Barrio Valsequillo:** Toda la Escuela Dominical (Adultos, Jóvenes, JAS y Fundamentos del Evangelio) se reunirá junta en el **Salón Sacramental durante los primeros 25 minutos** para ver y analizar los videos asignados.\n* **Manual y Materiales Oficiales de Video (2026):**\n  * 🔗 [Materiales de Instrucción Dominical para Jóvenes y Adultos](https://www.churchofjesuschrist.org/study/manual/changes-to-the-sunday-class-meeting-schedule-instruction-2026/youth-and-adult-sunday-instruction-materials?lang=spa)\n\n---\n\n### 📅 Historial de Clases (Ordenado de Más Reciente a Más Antigua)\n\n<details>\n<summary><b>📅 Clase Próxima: Domingo 13 de Septiembre de 2026 — \"El principio de la sabiduría es el temor de Jehová\" — 🟢 CLASE ACTUAL</b></summary>\n\n* **Maestro:** Hno. Enrique Leyva / Hno. Paul Leyva (Salón Sacramental — Primeros 25 min juntos)\n* **Escrituras de la Semana:** Proverbios 1–4; 15–16; 22; 31; Eclesiastés 1–3; 12 (*Ven, Sígueme — Antiguo Testamento 2026*, Lección 37).\n* **Enlace Oficial del Manual:** [Estudiar Lección Ven, Sígueme](https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/37?lang=spa)\n\n#### 💡 1. El Temor de Jehová como Reverencia y Amor (Proverbios 1:7; 9:10)\n* **📌 Concepto Clave:** \"Temor\" en el contexto de las escrituras no significa miedo punitivo, sino una reverencia profunda, respeto sagrado y amor devoto que nos lleva a alinear nuestra vida con la voluntad de Dios.\n* **📖 Escritura Estrella (Proverbios 1:7):**\n> *\"El principio de la sabiduría es el temor de Jehová; los insensatos desprecian la sabiduría y la enseñanza.\"*\n* **💬 Comentario Preparado para Participar en Clase:**\n> *\"Hermano Leyva, lo valioso de Proverbios es que aclara que la verdadera sabiduría no empieza en el intelecto humano, sino en la reverencia y amor a Dios. Cuando ponemos a Dios en primer lugar, nuestras decisiones se aclaran.\"*\n\n#### 🌿 2. Confiar en Jehová con Todo el Corazón (Proverbios 3:5-6)\n* **📌 Concepto Clave:** La promesa divina de que cuando no nos apoyamos únicamente en nuestra prudencia humana sino que reconocemos a Dios en todos nuestros caminos, Él endereza nuestras veredas.\n* **📖 Escritura Estrella (Proverbios 3:5-6):**\n> *\"Fíate de Jehová de todo tu corazón, y no te apoyes en tu propia prudencia. Reconócelo en todos tus caminos, y él enderezará tus veredas.\"*\n* **💬 Comentario Preparado para Participar en Clase:**\n> *\"A veces el estrés o la ansiedad surgen por querer controlar solos el futuro. Proverbios 3 nos recuerda que al entregar nuestras cargas en oración y confiar en el Señor, Él guía nuestros pasos hacia la paz.\"*\n\n#### 🗣️ 3. La Blanda Respuesta Quita la Ira (Proverbios 15:1)\n* **📌 Concepto Clave:** Las palabras amables y el autocontrol emocional desactivan el conflicto en la familia y en la iglesia.\n* **📖 Escritura Estrella (Proverbios 15:1):**\n> *\"La blanda respuesta quita la ira; mas la palabra áspera hace subir el furor.\"*\n\n#### ⏳ 4. Todo Tiene su Tiempo Bajo el Cielo (Eclesiastés 3:1-8; 12:13)\n* **📌 Concepto Clave:** Las temporadas de prueba, espera y esfuerzo tienen un propósito divino. El fin de todo discurso es amar a Dios y guardar Sus mandamientos.\n* **📖 Escritura Estrella (Eclesiastés 12:13):**\n> *\"El fin de todo el discurso oído es este: Teme a Dios, y guarda sus mandamientos; porque esto es el todo del hombre.\"*\n</details>\n\n<details>\n<summary><b>📅 Clase del 6 de Septiembre de 2026 — \"Alabe mi alma a Jehová\"</b></summary>\n\n* **Maestro:** Hno. Enrique Leyva / Hno. Paul Leyva\n* **Escrituras de la Semana:** Salmos 102–103; 110; 116–119; 127–128; 135–139; 146–150 (*Ven, Sígueme — Antiguo Testamento 2026*, Lección 36).\n* **Enlace Oficial del Manual:** [Estudiar Lección Ven, Sígueme](https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/36?lang=spa)\n</details>\n\n<details>\n<summary><b>📅 Clase del 30 de Agosto de 2026 — \"Crea en mí, oh Dios, un corazón limpio\"</b></summary>\n\n* **Maestro:** Hno. Enrique Leyva\n* **Escrituras de la Semana:** Salmos 49–51; 61–66; 69–72; 77–78; 85–86 (*Ven, Sígueme — Antiguo Testamento 2026*).\n* **Enlace Oficial del Manual:** [Estudiar Lección Ven, Sígueme](https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/35?lang=spa).\n</details>\n\n<details>\n<summary><b>📅 Clase del 12 de Julio de 2026 — \"El poder del ímpetu espiritual\"</b></summary>\n\n* **Temas analizados:** 2 Reyes 2–7. Eliseo, Naamán el sirio y la obediencia en las pequeñas cosas.\n</details>\n\n<details>\n<summary><b>📅 Clase del 5 de Julio de 2026 — \"Si Jehová es Dios, seguidle\"</b></summary>\n\n* **Temas analizados:** 1 Reyes 12–13; 17–22. La fe inquebrantable de Elías y la viuda de Sarepta.\n</details>\n\n<details>\n<summary><b>📅 Clase del 21 de Junio de 2026 — El poder sanador de Jesucristo</b></summary>\n\n* **Tema:** Introducción a *Ven, Sígueme* (Doctrina y Convenios / Antiguo Testamento).\n</details>\n\n---"}, {"title": "Inglés", "body": "*(Viernes a las 7:30 pm — En la Capilla)*\n*   **Facilitadores:** Élderes de la Capilla\n*   **Programa:** EnglishConnect 1 (Nivel básico de 3 niveles disponibles)\n\n### 📅 Historial de Clases\n\n#### Viernes 12 de Junio (Clase 1)\n*   Introducción a los niveles y dinámicas del curso.\n\n#### Viernes 19 de Junio (Cancelada)\n*   Clase suspendida por mantenimiento de luz en la capilla.\n*   **Tarea de estudio autónomo:** Estudiar y practicar la pronunciación de la **Lección 2: Greetings and Introductions** en la web de la iglesia: [Estudiar Lección 2](https://www.churchofjesuschrist.org/study/manual/englishconnect1-learner/02-unit-1/05-lesson-02?lang=spa&id=title5#title5).\n\n#### Viernes 26 de Junio (Clase 2)\n*   Práctica y repaso oral de la Lección 2 (Greetings and Introductions).\n*   Se compartió en el grupo el libro de trabajo digital del curso: [Workbook EnglishConnect 1](file:///home/rogerman/Downloads/englishconnect_workbook_1.pdf).\n\n### 🦋 Lectura y Práctica: A little mariposita\n*   **Lectura divertida en Spanglish:**\n    *Once upon a time,*\n    *a little mariposita*\n    *was flying in the jardin,*\n    *when de repente, ¡cataplum!*\n\n    *\"¡Ay, jijo!\" She dijo,*\n    *\"I forgot to open my alitas…\"*\n\n### 🗣️ Bloques de Conversación Rápida (Conversational Chunks)\nAprende frases nativas completas como \"bloques de construcción\":\n\n*   **Aceptar invitaciones o propuestas:**\n    *   **That sounds great!** (¡Me parece excelente / Suena genial!)\n    *   **I'd be happy to!** (¡Con gusto / Estaría encantado de hacerlo!)\n*   **Añadir aclaraciones o detalles:**\n    *   **Just one quick thing...** (Solo un detalle / puntito rápido...)\n    *   **To ramble** (Irse por las ramas / hablar de más por nervios)\n*   **Dar razones y resumir:**\n    *   **Since...** (Ya que... / Puesto que...)\n    *   **In short...** (En resumen... / En pocas palabras...)\n\n---\n\n---\n\n---"}, {"title": "Ministración", "body": "*(Guía master de lecciones doctrinales, plantillas de llamada y bitácora de ministración)*\n\n<details>\n<summary><b>📁 Categoría A: Lecciones Misionales Fundamentales (Doctrina)</b></summary>\n\n<details>\n<summary><b>📖 A1. La Restauración del Evangelio (José Smith, Primera Visión y El Libro de Mormón)</b></summary>\n\n* **📌 Concepto Central:** Dios restauró Su verdad a la tierra mediante el profeta José Smith después de un periodo de apostasía. El Libro de Mormón es la evidencia tangible y un segundo testigo de que Jesucristo es el Salvador.\n* **📖 Escrituras Clave Completas:**\n  * **Hechos 3:20-21:** *\"Y él envíe a Jesucristo, que os fue antes predicado; a quien de cierto es menester que el cielo reciba hasta los tiempos de la restauración de todas las cosas, de que habló Dios por boca de sus santos profetas que han sido desde tiempo antiguo.\"*\n  * **Santiago 1:5 & José Smith—Historia 1:17:** *\"Y si alguno de vosotros tiene falta de sabiduría, pídala a Dios... Vi una columna de luz, más brillante que el sol... Vi a dos Personajes... Uno de ellos me habló, llamándome por mi nombre, y dijo, señalando al otro: ¡Este es mi Hijo Amado: Escúchalo!\"*\n  * **Moroni 10:4-5:** *\"Y cuando recibáis estas cosas, quisiera exhortaros a que preguntéis a Dios el Padre Eterno, en el nombre de Cristo, si no son verdaderas estas cosas; y si pedís con un corazón sincero, con verdadera intención, teniendo fe en Cristo, él os manifestará la verdad de ellas por el poder del Espíritu Santo...\"*\n* **💬 Frases y Testimonio Sugerido:**\n  > *\"Dios nunca nos ha dejado abandonados. Al igual que en los tiempos bíblicos llamó a Moisés o a Abraham para guiar a Su pueblo, en nuestros días Dios volvió a llamar a un profeta para restaurar la verdad pura y traernos paz.\"*\n  > *\"El Libro de Mormón no es solo un libro histórico; es la prueba viva de que Dios volvió a hablar. Al leerlo diariamente, uno siente la voz del Salvador y una fortaleza espiritual inquebrantable.\"*\n* **📞 Plantilla Rápida de Llamada (Genérica):**\n  1. *Saludo y contexto:* Saludar con calidez y mencionar que Dios cuida a Sus hijos en todas las épocas.\n  2. *Testimonio:* Compartir que la Primera Visión demuestra que Dios escucha las oraciones sinceras de un joven de 14 años.\n  3. *Invitación al Libro de Mormón:* Invitar a leer el Libro de Mormón y a preguntar a Dios en oración.\n* **📝 Bitácora e Historial de Personas (Casos Reales):**\n  * **Hermano Agustín (19/Jul/2026):** Cita acompañando a los misioneros sobre la Apostasía, la necesidad de la Restauración y la Primera Visión de José Smith.\n</details>\n\n<details>\n<summary><b>🌊 A2. El Bautismo y el Evangelio de Jesucristo (Los 5 Pilares)</b></summary>\n\n* **📌 Concepto Central:** El Evangelio es la senda de salvación: Fe en Jesucristo, Arrepentimiento, Bautismo por inmersión, Don del Espíritu Santo y Perseverar hasta el fin (Lección 3 de Predicad Mi Evangelio). Sentir el perdón de Cristo y recibir el Espíritu Santo nos da dirección clara y paz interior.\n* **📖 Escrituras Clave Completas:**\n  * **2 Nefi 31:17-18:** *\"Porque la puerta por la cual debéis entrar es el arrepentimiento y el bautismo por agua; y entonces viene una remisión de vuestros pecados por fuego y por el Espíritu Santo; y entonces estáis en este camino estrecho y angosto que conduce a la vida eterna.\"*\n  * **3 Nefi 12:22:** El Salvador nos invita a evitar la ira y las divisiones del adversario para transmitir Su paz.\n* **💬 Frases y Testimonio Sugerido:**\n  > *\"El bautismo y el arrepentimiento son un borrón y cuenta nueva en el alma. Para mí en lo personal, el Evangelio no ha sido solo una religión de ir a la iglesia los domingos, sino mi guía de vida diaria para tener una paz real en medio del estrés.\"*\n* **📞 Plantilla Rápida de Llamada (Genérica de 4 pasos - 2 a 3 min):**\n  1. *Paso 1 (Saludo):* Saludo cálido y bienvenida cordial al amigo o investigador.\n  2. *Paso 2 (Testimonio):* Testificar que Jesucristo vive y que Su expiación brinda paz diaria ante los desafíos.\n  3. *Paso 3 (Espíritu y Capilla):* Explicar que el Espíritu Santo actúa como mapa de paz y que en la capilla hay una familia de amigos que apoya de verdad.\n  4. *Paso 4 (Invitación):* Invitar con cariño a acompañarte el domingo a la reunión sacramental de las 10:00 am.\n* **📝 Bitácora e Historial de Personas (Casos Reales):**\n  * **Hermano Bruno (01/Sep/2026):** Primera asistencia a la capilla realizada en Lomas Bella; asistirá este domingo a la capilla de **Valsequillo a las 12:00 pm**. Desea seguir el ejemplo de Jesucristo con **fecha proyectada de bautismo para el 20 de Septiembre**. Le inspiran mucho los himnos (se le compartió el Himno 218). Cita presencial agendada para **miércoles a las 6:00 pm** en la capilla de Valsequillo junto a los Élderes para responder sus preguntas sobre la Biblia y parábolas.\n  * **Ángel (31/Ago/2026):** Llamada misional con los Élderes sobre Helamán 14 (las profecías de Samuel el Lamanita). Testimonio compartido sobre Jesucristo como la luz del mundo, la remisión de pecados mediante Su sacrificio y el libre albedrío para elegir lo bueno (v. 30-31).\n  * **Alejandro (26/Ago/2026):** Cita misional telefónica a las 6:00 pm acompañando a los élderes para dar la bienvenida, testificar del Evangelio e invitarlo a la capilla este domingo.\n  * **Hermano Jesús (07/Jul/2026):** Preparación y dedicatoria bautismal.\n</details>\n\n<details>\n<summary><b>🌿 A3. Las Leyes y Mandamientos (Castidad, Palabra de Sabiduría y Diezmo)</b></summary>\n\n* **📌 Concepto Central:** Las leyes de Dios no son restricciones rígidas, sino límites de amor que nos protegen del peligro y nos llenan de paz, salud y libertad verdaderas.\n* **📖 Escrituras Clave Completas:**\n  * **1. Ley de Castidad (1 Corintios 6:19-20):** *\"¿O ignoráis que vuestro cuerpo es templo del Espíritu Santo, el cual está en vosotros, el cual tenéis de Dios, y que no sois vuestros? Porque habéis sido comprados por precio; glorificad, pues, a Dios en vuestro cuerpo y en vuestro espíritu, los cuales son de Dios.\"*\n  * **2. Palabra de Sabiduría (Doctrina y Convenios 89:18-20):** *\"Y todos los santos que se acuerden de guardar y hacer estas palabras, a pie de juntillas... recibirán salud en su ombligo y médula en sus huesos; y hallarán sabiduría y grandes tesoros de conocimiento...\"*\n  * **3. Ley del Diezmo (Malaquías 3:10):** *\"Traed todos los diezmos al alfolí y haya alimento en mi casa; y probadme ahora en esto, dice Jehová de los ejércitos, si no os abriré las ventanas de los cielos y derramaré sobre vosotros bendición hasta que sobreabunde.\"*\n</details>\n\n</details>\n\n<details>\n<summary><b>👑 Categoría B: Temas de Fortalecimiento Personal y Emocional</b></summary>\n\n<details>\n<summary><b>👑 B1. Edificar la Fe en Jesucristo ante las Pruebas de la Vida</b></summary>\n\n* **📌 Concepto Central:** Tener fe no significa que no enfrentaremos tempestades, dolor o injusticias en el mundo; significa saber con certeza que Jesucristo camina a nuestro lado en la tormenta.\n* **📖 Escrituras Clave Completas:**\n  * **Helamán 5:12:** *\"Y ahora bien, recordad, hijos míos, recordad que es sobre la roca de nuestro Redentor, el cual es Cristo, el Hijo de Dios, donde debéis establecer vuestro fundamento...\"*\n  * **Éxodo 14:14:** *\"Jehová peleará por vosotros, y vosotros estaréis tranquilos.\"*\n</details>\n\n<details>\n<summary><b>👑 B2. Los Mandamientos como Cercas de Amor y Cordel de la Cometa</b></summary>\n\n* **📌 Concepto Central:** Los mandamientos no nos quitan la libertad; nos dan la protección necesaria para elevar nuestra vida sin estrellarnos.\n* **📖 Escrituras Clave Completas:**\n  * **Helamán 14:30:** *\"Y ahora bien, recordad, recordad, mis hermanos, que el que perece, perece por su propia culpa; y el que hace lo malo, lo hace contra sí mismo; pues he aquí, sois libres...\"*\n</details>\n\n</details>\n\n<details>\n<summary><b>📁 Categoría C: Herramientas Operativas y Bitácora de Ministración</b></summary>\n\n<details>\n<summary><b>📞 C1. Plantilla Rápida de Llamada Misional / Ministración (4 Pasos - 2 a 3 Minutos)</b></summary>\n\n1. **Paso 1 (Saludo):** Saludo cálido y bienvenida cordial al amigo o investigador.\n2. **Paso 2 (Testimonio):** Testificar que Jesucristo vive y que Su expiación brinda paz diaria ante los desafíos.\n3. **Paso 3 (Espíritu y Capilla):** Explicar que el Espíritu Santo actúa como mapa de paz y que en la capilla hay una familia de amigos que apoya de verdad.\n4. **Paso 4 (Invitación):** Invitar con cariño a acompañarte el domingo a la reunión sacramental de las 10:00 am.\n</details>\n\n</details>\n\n---"}, {"title": "Psicología", "body": "*(Sesiones Terapéuticas — Facultad de Psicología BUAP & Terapias Personales)*\n* **Institución:** Facultad de Psicología de la BUAP (Puebla Centro — Cuota $30 MXN + pasajes ~$50 MXN/semana)\n* **Terapeuta:** Javier (Psicólogo en formación respaldado por supervisores y docentes de la BUAP).\n* **Horario Fijo de Terapia:** **Jueves a las 3:00 pm** (Facultad de Psicología BUAP, Puebla Centro).\n* **Entregable:** Biografía personal entregada en impreso al inicio del proceso.\n* **Factores Desencadenantes (Restan puntos):** Incertidumbre laboral/económica, presión de mudanza/renta al 7 de septiembre, fricciones en ambientes con personas molestas y fatiga acumulada.\n* **Factores Ancladores (Suman/mantienen puntos):** Rutina física (agua, ventana, caminata, sentadillas, baño), avance en el sistema VROMLIX, anclaje espiritual/oración y las sesiones de desahogo terapéutico.\n\n---\n\n### 📅 Historial de Sesiones Terapéuticas\n\n<details>\n<summary><b>📅 Sesión Próxima (Jueves 3:00 pm): Factores, Gaslighting y Desvalorización Laboral — 🟢 SESIÓN ACTUAL</b></summary>\n\n### 🧠 1. La Tarea de los Factores (Por qué el psicólogo pide detectarlos)\nEn la terapia cognitiva-conductual, el psicólogo es un facilitador, pero tú eres el único observador en tiempo real de tus 24 horas. Él te pide esta tarea para enseñarte autoconocimiento: si tú aprendes a identificar qué situaciones te suben o te bajan de tu nivel base (que hoy ubicas en un buen 7 u 8), tú mismo ganas el control de tu salud mental.\n\n#### ⬆️ Factores Aumentadores (Suben tu nivel de 7-8 a 9-10):\n* **Resolución de pendientes:** Saber que ya coordinaste tu mudanza o que cerraste una tarea pendiente.\n* **Hábitos físicos:** Tu caminata matutina, beber agua y tomar el sol.\n* **Conexión social/espiritual:** Charlas agradables (con los Élderes, Hna. Alma o amigos), orar y asistir a la capilla.\n* **Logro personal:** Avanzar en proyectos como el Mercadito o resolver un problema técnico.\n\n#### ⬇️ Factores Reductores (Bajan tu nivel de 7-8 a 4-5):\n* **Incertidumbre:** El estrés de no tener fecha exacta para la mudanza o temas de liquidez económica.\n* **Cansancio/Desvelo:** Dormir mal o acumular fatiga física.\n* **Tensión en relaciones:** Discusiones o actitudes de regaño/enojo de personas a tu alrededor.\n* **Aislamiento:** Pasar demasiado tiempo encerrado sin hablar con nadie o sin salir al sol.\n\n---\n\n### 🕯️ 2. Análisis del Gaslighting (Abuso Emocional y Manipulación de la Realidad)\n* **Definición y Mecánica:** El *gaslighting* es un patrón sistemático de manipulación psicológica en el que una persona busca distorsionar la percepción de la realidad de la otra, haciéndola dudar de su propia memoria, juicio, capacidades y cordura.\n* **Ejemplos Reales Extraídos del Perfil Psicológico (Caso Lili):**\n  1. **Invalidación de la Reconexión con el Primogénito (Sección 1.3):** Catalogó el intento de reconexión y la historia con el primer hijo como una *\"confabulación\"*, aplicando técnicas de invalidación narrativa (gaslighting) para obligarte a dudar de tus recuerdos y aislarte cognitivamente.\n  2. **Monopolio de la Narrativa Moral (Secciones 3.3 y 3.6):** Uso de frases invalidantes de control moral como *\"Primero perdónate a ti mismo\"* e inyección sistemática de culpa para situarse como la única autoridad moral de la relación.\n  3. **Confesiones Preventivas de Conductas Límite (Sección 3.3):** Revelaciones estratégicas de conductas inapropiadas o desnudez social para controlar la conversación, desactivar tu respuesta emocional y sembrarte ansiedad somática (sensación de frío intenso).\n  4. **Triangulación de Control Social (Sección 3.6):** Preferencia por reclutar intermediarios (tu mamá, René, amigos comunes) para ejercer presión social sin negociar de adulto a adulto, presentándose públicamente como la persona conciliadora mientras desacreditaba activamente tu imagen.\n  5. **Espejeación de la Frialdad Materna (Sección 3.7):** Replicación del patrón de rechazo, frialdad intermitente, descalificación de tus necesidades y preferencia por la fachada social (redes/grupos) sobre la intimidad real.\n\n---\n\n### 🎯 3. Temas Específicos para Abordar en la Siguiente Sesión con Javier:\n1. **Presentación de los Factores Aumentadores y Reductores:** Explicar el termómetro personal y cómo la rutina física y el avance técnico mantienen el nivel en 7-8.\n2. **Impacto del Gaslighting recibido:** Exponer cómo la manipulación previa distorsionó la autoconfianza y generó una tendencia a dudar de uno mismo o estar a la defensiva.\n3. **Sentimiento de devaluación laboral (\"Hacerme sentir que no hice un buen trabajo\"):** Trabajar en la sensación inducida de que el esfuerzo dedicado no fue suficiente o no tuvo valor real, reaprendiendo a validar objetivamente los propios logros y entregables.\n4. **Incomodidad y malestar profundo al sentir que se falla:** Explorar la ansiedad que surge al percibir que se comete un error o decepciona a alguien, aprendiendo a tolerar el margen de error humano con autocompasión y sin autocastigo.\n\n---\n\n### 💬 ¿Cómo iniciar la conversación en la sesión?\n> *\"Javier, estuve analizando mi biografía y la tarea de los factores. Hoy ubico mi estado en un nivel 7 u 8. Identifiqué claramente los factores que me suben (rutina física, logros y conexión) y los que me bajan (incertidumbre y desvelo). Pero además, me gustaría abordar cómo el gaslighting que viví en el pasado me hizo sentir que mi trabajo nunca era bueno, y la incomodidad profunda que siento cada vez que percibo que puedo fallar.\"*\n</details>"}, {"title": "Quórum de Élderes", "body": "*(Domingos a la 1:00 pm — Alternada con la Escuela Dominical)*\n* **Presidente de Quórum:** Stalin Mijail Los De Los Santos\n\n### 📋 Pendientes Específicos con el Pdte. Stalin Mijail:\n1. **Oportunidad Laboral con Don Alfredo:** Preguntarle al Pdte. Stalin acerca de Don Alfredo para explorar posibilidades de trabajo.\n2. **Curso de Preparación para el Templo:** Dar seguimiento al curso de preparación para el Templo y ver los siguientes pasos.\n\n---\n\n### 📅 Historial de Clases (Ordenado de Más Reciente a Más Antigua)\n\n<details>\n<summary><b>📅 Clase Próxima: Domingo 13 de Septiembre de 2026 — \"El principio de la sabiduría es el temor de Jehová\" — 🟢 CLASE ACTUAL</b></summary>\n\n* **Maestro:** Hno. Enrique Leyva / Hno. Paul Leyva (Salón Sacramental — Primeros 25 min juntos)\n* **Escrituras de la Semana:** Proverbios 1–4; 15–16; 22; 31; Eclesiastés 1–3; 12 (*Ven, Sígueme — Antiguo Testamento 2026*, Lección 37).\n* **Enlace Oficial del Manual:** [Estudiar Lección Ven, Sígueme](https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/37?lang=spa)\n\n#### 💡 1. El Temor de Jehová como Reverencia y Amor (Proverbios 1:7; 9:10)\n* **📌 Concepto Clave:** \"Temor\" en el contexto de las escrituras no significa miedo punitivo, sino una reverencia profunda, respeto sagrado y amor devoto que nos lleva a alinear nuestra vida con la voluntad de Dios.\n* **📖 Escritura Estrella (Proverbios 1:7):**\n> *\"El principio de la sabiduría es el temor de Jehová; los insensatos desprecian la sabiduría y la enseñanza.\"*\n* **💬 Comentario Preparado para Participar en Clase:**\n> *\"Hermano Leyva, lo valioso de Proverbios es que aclara que la verdadera sabiduría no empieza en el intelecto humano, sino en la reverencia y amor a Dios. Cuando ponemos a Dios en primer lugar, nuestras decisiones se aclaran.\"*\n\n#### 🌿 2. Confiar en Jehová con Todo el Corazón (Proverbios 3:5-6)\n* **📌 Concepto Clave:** La promesa divina de que cuando no nos apoyamos únicamente en nuestra prudencia humana sino que reconocemos a Dios en todos nuestros caminos, Él endereza nuestras veredas.\n* **📖 Escritura Estrella (Proverbios 3:5-6):**\n> *\"Fíate de Jehová de todo tu corazón, y no te apoyes en tu propia prudencia. Reconócelo en todos tus caminos, y él enderezará tus veredas.\"*\n* **💬 Comentario Preparado para Participar en Clase:**\n> *\"A veces el estrés o la ansiedad surgen por querer controlar solos el futuro. Proverbios 3 nos recuerda que al entregar nuestras cargas en oración y confiar en el Señor, Él guía nuestros pasos hacia la paz.\"*\n\n#### 🗣️ 3. La Blanda Respuesta Quita la Ira (Proverbios 15:1)\n* **📌 Concepto Clave:** Las palabras amables y el autocontrol emocional desactivan el conflicto en la familia y en la iglesia.\n* **📖 Escritura Estrella (Proverbios 15:1):**\n> *\"La blanda respuesta quita la ira; mas la palabra áspera hace subir el furor.\"*\n\n#### ⏳ 4. Todo Tiene su Tiempo Bajo el Cielo (Eclesiastés 3:1-8; 12:13)\n* **📌 Concepto Clave:** Las temporadas de prueba, espera y esfuerzo tienen un propósito divino. El fin de todo discurso es amar a Dios y guardar Sus mandamientos.\n* **📖 Escritura Estrella (Eclesiastés 12:13):**\n> *\"El fin de todo el discurso oído es este: Teme a Dios, y guarda sus mandamientos; porque esto es el todo del hombre.\"*\n</details>\n\n<details>\n<summary><b>📅 Clase del 6 de Septiembre de 2026 — \"Alabe mi alma a Jehová\"</b></summary>\n\n* **Maestro:** Hno. Enrique Leyva / Hno. Paul Leyva\n* **Escrituras de la Semana:** Salmos 102–103; 110; 116–119; 127–128; 135–139; 146–150 (*Ven, Sígueme — Antiguo Testamento 2026*, Lección 36).\n* **Enlace Oficial del Manual:** [Estudiar Lección Ven, Sígueme](https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/36?lang=spa)\n</details>\n\n<details>\n<summary><b>📅 Clase del 30 de Agosto de 2026 — \"El Poder del Arrepentimiento Diario\" (Domingo de Amigos)</b></summary>\n\n* **Maestro:** Presidencia del Quórum / Stalin Mijail\n* **Fuente:** Discurso de Conferencia General — *\"El poder del arrepentimiento diario\"* (Presidente Russell M. Nelson).\n* **Puntos Clave:** El arrepentimiento es la llave del progreso diario. Organización del Domingo de Amigos y bienvenida a visitantes como el Hno. Bruno.\n</details>\n\n<details>\n<summary><b>📅 Clase del 23 de Agosto de 2026 — \"La Paz de Cristo Calma las Tempestades del Alma\"</b></summary>\n\n* **Maestro:** Presidencia del Quórum\n* **Fuente:** Discurso del Élder Ulisses Soares (Conferencia General) — [Leer en ChurchofJesusChrist.org](https://www.churchofjesuschrist.org/study/general-conference/2026/04/45soares?lang=spa).\n* **Puntos Clave:** Acudir al Salvador para encontrar mansedumbre y paz ante los momentos de estrés acumulado y fatiga.\n</details>\n\n<details>\n<summary><b>📅 Clase del 16 de Agosto de 2026 — \"Acceso al Poder de Dios mediante los Convenios\"</b></summary>\n\n* **Maestro:** Presidencia del Quórum\n* **Fuente:** Discurso del Élder Dale G. Renlund (Conferencia General) — [Leer en ChurchofJesusChrist.org](https://www.churchofjesuschrist.org/study/general-conference/2026/04/41renlund?lang=spa).\n* **Puntos Clave:** Los convenios nos conectan directamente con el poder de Dios para superar las pruebas cotidianas.\n</details>\n\n<details>\n<summary><b>📅 Clase del 9 de Agosto de 2026 — \"Construir una Vida de Fe Duradera\"</b></summary>\n\n* **Maestro:** Presidencia del Quórum\n* **Fuente:** Discurso del Élder Quentin L. Cook (Conferencia General) — [Leer en ChurchofJesusChrist.org](https://www.churchofjesuschrist.org/study/general-conference/2026/04/32cook?lang=spa).\n* **Puntos Clave:** Fortalecer el altar familiar y la ministración mutua entre los hermanos del Quórum.\n</details>\n\n<details>\n<summary><b>📅 Clase del 26 de Julio de 2026 — \"Poder para Superar al Enemigo\"</b></summary>\n\n* **Maestro:** Presidencia del Quórum\n* **Fuente:** Discurso del Élder David A. Bednar (Conferencia General) — [Leer en ChurchofJesusChrist.org](https://www.churchofjesuschrist.org/study/general-conference/2026/04/24bednar?lang=spa).\n* **Puntos Clave:** La guía constante del Espíritu Santo para discernir la verdad. Encuesta del Quórum y apoyo a bautismos de julio.\n</details>\n\n<details>\n<summary><b>📅 Clase del 12 de Julio de 2026 — Discurso de Patrick Kearon</b></summary>\n\n* **Fuente:** Discurso de Patrick Kearon (Conferencia General) — [Leer en ChurchofJesusChrist.org](https://www.churchofjesuschrist.org/study/general-conference/2026/04/13kearon?lang=spa).\n* **Puntos Clave:** La invitación constante a venir a Cristo y Su gracia incondicional.\n</details>\n\n<details>\n<summary><b>📅 Clase del 28 de Junio de 2026 — \"Recordad, recordad\"</b></summary>\n\n* **Fuente:** Discurso de Chi Hong (Sam) Wong (Conferencia General) — [Leer en ChurchofJesusChrist.org](https://www.churchofjesuschrist.org/study/general-conference/2026/04/52wong?lang=spa).\n* **Metáforas:** La cometa y el cordel (Pdte. Oaks) / Pernos de anclaje de acero (Élder Bednar).\n</details>\n\n<details>\n<summary><b>📅 Clase del 14 de Junio de 2026 — \"El carácter de Cristo\"</b></summary>\n\n* **Fuente:** Discurso de D. Todd Christofferson (Conferencia General) — [Leer en ChurchofJesusChrist.org](https://www.churchofjesuschrist.org/study/general-conference/2026/04/51christofferson?lang=spa).\n* **Puntos Clave:** Desarrollar caridad, humildad y devoción a la voluntad del Padre.\n</details>\n\n---\n\n---"}, {"title": "Resiliencia", "body": "*(Domingos 12:30 pm — Biblioteca / Salón del Sumo Consejo)*\n*   **Facilitadora:** Hna. Alma Luis\n*   **Estatus:** Curso activo (Clase 12 completada el 30 de agosto; Tarea asignada con Jesús Coronel).\n\n### 📌 Concepto General y Pilares\n*   **Concepto:** Capacidad de superar desafíos y estrés adaptando habilidades prácticas y fe en Jesucristo. No evita el dolor, sino que ayuda a procesarlo.\n*   **Pilares:** Gracia de Cristo, Perspectiva Eterna, Albedrío y Enfoque Integral (espiritual y psicológico/médico).\n\n---\n\n### 📅 Historial de Clases (Ordenado de Más Reciente a Más Antigua)\n\n<details>\n<summary><b>📅 Clase Próxima: Domingo 13 de Septiembre de 2026 — \"El principio de la sabiduría es el temor de Jehová\" — 🟢 CLASE ACTUAL</b></summary>\n\n* **Maestro:** Hno. Enrique Leyva / Hno. Paul Leyva (Salón Sacramental — Primeros 25 min juntos)\n* **Escrituras de la Semana:** Proverbios 1–4; 15–16; 22; 31; Eclesiastés 1–3; 12 (*Ven, Sígueme — Antiguo Testamento 2026*, Lección 37).\n* **Enlace Oficial del Manual:** [Estudiar Lección Ven, Sígueme](https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/37?lang=spa)\n\n#### 💡 1. El Temor de Jehová como Reverencia y Amor (Proverbios 1:7; 9:10)\n* **📌 Concepto Clave:** \"Temor\" en el contexto de las escrituras no significa miedo punitivo, sino una reverencia profunda, respeto sagrado y amor devoto que nos lleva a alinear nuestra vida con la voluntad de Dios.\n* **📖 Escritura Estrella (Proverbios 1:7):**\n> *\"El principio de la sabiduría es el temor de Jehová; los insensatos desprecian la sabiduría y la enseñanza.\"*\n* **💬 Comentario Preparado para Participar en Clase:**\n> *\"Hermano Leyva, lo valioso de Proverbios es que aclara que la verdadera sabiduría no empieza en el intelecto humano, sino en la reverencia y amor a Dios. Cuando ponemos a Dios en primer lugar, nuestras decisiones se aclaran.\"*\n\n#### 🌿 2. Confiar en Jehová con Todo el Corazón (Proverbios 3:5-6)\n* **📌 Concepto Clave:** La promesa divina de que cuando no nos apoyamos únicamente en nuestra prudencia humana sino que reconocemos a Dios en todos nuestros caminos, Él endereza nuestras veredas.\n* **📖 Escritura Estrella (Proverbios 3:5-6):**\n> *\"Fíate de Jehová de todo tu corazón, y no te apoyes en tu propia prudencia. Reconócelo en todos tus caminos, y él enderezará tus veredas.\"*\n* **💬 Comentario Preparado para Participar en Clase:**\n> *\"A veces el estrés o la ansiedad surgen por querer controlar solos el futuro. Proverbios 3 nos recuerda que al entregar nuestras cargas en oración y confiar en el Señor, Él guía nuestros pasos hacia la paz.\"*\n\n#### 🗣️ 3. La Blanda Respuesta Quita la Ira (Proverbios 15:1)\n* **📌 Concepto Clave:** Las palabras amables y el autocontrol emocional desactivan el conflicto en la familia y en la iglesia.\n* **📖 Escritura Estrella (Proverbios 15:1):**\n> *\"La blanda respuesta quita la ira; mas la palabra áspera hace subir el furor.\"*\n\n#### ⏳ 4. Todo Tiene su Tiempo Bajo el Cielo (Eclesiastés 3:1-8; 12:13)\n* **📌 Concepto Clave:** Las temporadas de prueba, espera y esfuerzo tienen un propósito divino. El fin de todo discurso es amar a Dios y guardar Sus mandamientos.\n* **📖 Escritura Estrella (Eclesiastés 12:13):**\n> *\"El fin de todo el discurso oído es este: Teme a Dios, y guarda sus mandamientos; porque esto es el todo del hombre.\"*\n</details>\n\n<details>\n<summary><b>📅 Clase del 6 de Septiembre de 2026 — \"Alabe mi alma a Jehová\"</b></summary>\n\n* **Maestro:** Hno. Enrique Leyva / Hno. Paul Leyva\n* **Escrituras de la Semana:** Salmos 102–103; 110; 116–119; 127–128; 135–139; 146–150 (*Ven, Sígueme — Antiguo Testamento 2026*, Lección 36).\n* **Enlace Oficial del Manual:** [Estudiar Lección Ven, Sígueme](https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/36?lang=spa)\n</details>\n\n<details>\n<summary><b>📅 Clase 12 (30 de Agosto de 2026) — Dominar la Ira y Resolver los Problemas</b></summary>\n\n* **Tema Principal:** Dominar la Ira y Resolver los Problemas.\n* **Principio de Mi Fundamento:** *Resolver los problemas*.\n* **Compañeros de Acción (Semana del 31 de Agosto al 6 de Septiembre):** **Roger y Jesús Coronel**.\n\n* **📌 Valores y Habilidades Emocionales de la Clase:**\n  1. **Comprender la ira:** Reconocer que la ira es una emoción secundaria que oculta vulnerabilidad o dolor no expresado.\n  2. **Darse cuenta de cómo se intensifica la ira:** Identificar las señales físicas (calor en el pecho, tensión muscular, aceleración del pulso).\n  3. **Comprender las emociones que hay detrás de la ira (Lista de Emociones Subyacentes):**\n     * *Grupo 1 (Vulnerabilidad y Dolor):* Resentido, Decepcionado, Avergonzado, Desesperanzado, Culpable, Abrumado, Abochornado, Frustrado, Inferior, Duelo o pesar, Insensible, Desconsolado, Asustado.\n     * *Grupo 2 (Tensión y Amenaza):* Ansioso, Preocupado, Amenazado, Nervioso, Rechazado, Legitimado, Dolido, Ofendido, Victimizado, Solitario, Injusticia, Hambre.\n     * *Grupo 3 (Factores Fisiológicos y Expectativas):* Fatiga, Expectativas no satisfechas.\n  4. **Decidir reaccionar a la ira de diferentes maneras:** Elegir conscientemente la regla de los 90 segundos, respiración 4-4-6 y la *Pausa sin huir* (*\"Dame 5 minutos para calmarme y seguimos hablando bien\"*).\n  5. **Controlar la ira como discípulos de Jesucristo:** Seguir el ejemplo del Salvador en mansedumbre, caridad y pacifición (3 Nefi 12:22).\n\n* **📝 Tarea Completa y Contestaciones Desarrolladas (Para Roger y Jesús Coronel):**\n  1. **¿Qué emociones subyacentes identifico detrás de mi ira en momentos de estrés?**\n     * *Respuesta:* Principalmente **expectativas no satisfechas, fatiga acumulada e injusticia**. Al identificar que detrás del malestar hay cansancio o expectativas no cumplidas, puedo procesar la emoción con objetividad en lugar de reaccionar impulsivamente.\n  2. **¿Cómo me doy cuenta de que la ira se está intensificando?**\n     * *Respuesta:* Siento tensión física inmediata y aceleración del pensamiento. La clave es activar la **regla de los 90 segundos** e iniciar la respiración 4-4-6 antes de emitir cualquier respuesta oral o escrita.\n  3. **¿Qué haré de manera diferente cuando me sienta abrumado u ofendido?**\n     * *Respuesta:* Aplicar la *Pausa sin huir*: comunicar calmadamente a la persona que necesito unos minutos para despejar la mente y retomar la plática con respeto y serenidad.\n  4. **¿Cómo nos ayuda el controlar la ira a ser mejores discípulos de Jesucristo?**\n     * *Respuesta:* Jesucristo nos enseñó a ser pacificadores. Al controlar la ira, cerramos la puerta a las divisiones del adversario y permitimos que la paz y la guía del Espíritu Santo prevalezcan en nuestro hogar y relaciones.\n  5. **Compromiso práctico semanal con el Compañero de Acción (Jesús Coronel):**\n     * *Compromiso:* Monitorear diariamente el tablero de emociones subyacentes y mantener contacto con el Hno. Jesús Coronel para compartir avances en el control de disparadores antes de la próxima sesión dominical.\n</details>\n\n<details>\n<summary><b>📅 Clase 11 (23 de Agosto de 2026) — Control de la Ira y Resolución de Problemas</b></summary>\n\n* **Tema:** Control de la Ira y Resolución de Problemas.\n* **Compañeros de Acción:** Roger y Gaby.\n* **Herramientas Clave:** Regla de los 90 segundos, respiración 4-4-6, Pausa sin huir y la enseñanza de *La Concha del Mar*.\n</details>\n\n<details>\n<summary><b>📅 Clase 10 (16 de Agosto de 2026) — Desarrollo de la Resiliencia</b></summary>\n\n* **Tema:** Desarrollo de la resiliencia y superación de pruebas.\n* **Video:** Reflexión de resiliencia ([Ver en YouTube](https://youtu.be/cEZJgP8zLIU)).\n* **Compañeros de Acción:** Roger y Lulú.\n</details>\n\n<details>\n<summary><b>📅 Clase 9 (9 de Agosto de 2026) — Perspectiva Interior y Sanación Emocional</b></summary>\n\n* **Tema:** Perspectiva interior y sanación emocional.\n* **Video:** Reflexión sobre la mirada interior ([Ver en YouTube](https://youtu.be/nlN5Oswsz9Q)).\n* **Compañeros de Acción:** Roger y Mari Fausta.\n</details>\n\n<details>\n<summary><b>📅 Clase 8 (2 de Agosto de 2026) — Manejo y Reducción del Estrés</b></summary>\n\n* **Tema:** Manejo y Reducción del Estrés en la Vida Diaria.\n* **Videos de Apoyo:** Técnicas de manejo de estrés ([Video 1](https://youtu.be/4gpFo0BZgGM) y [Video 2](https://youtu.be/6xUOIch6Ei4)).\n</details>\n\n<details>\n<summary><b>📅 Clase 7 (26 de Julio de 2026) — Comprender los Niveles de Estrés</b></summary>\n\n* **Tema:** Comprender los Niveles de Estrés.\n* **Compañeros de Acción:** Omar y Jesús.\n</details>\n\n<details>\n<summary><b>📅 Clase 6 (19 de Julio de 2026) — Salud Mental y Manejo de Emociones</b></summary>\n\n* **Tema:** Manejar nuestras emociones de manera efectiva.\n* **Video:** *\"Manejo de Emociones y Salud Mental\"* ([Ver en YouTube](https://youtu.be/Vf7N6ADsmKg)).\n* **Compañero de Acción:** Hno. Omar.\n</details>\n\n<details>\n<summary><b>📅 Clase 5 (12 de Julio de 2026) — Cuerpo, Salud Física y Descanso</b></summary>\n\n* **Tema:** Cuerpo, Salud Física y Descanso.\n* **Video:** *\"Comprometerse con uno mismo\"* ([Ver en YouTube](https://youtu.be/P3Y0sBB5VdE)).\n</details>\n\n<details>\n<summary><b>📅 Clase 4 (5 de Julio de 2026) — Práctica para Cambiar Pensamientos Incorrectos</b></summary>\n\n* **Tema:** Práctica diaria para cambiar pensamientos incorrectos.\n* **Compañero de Acción:** Jesús Coronel.\n</details>\n\n<details>\n<summary><b>📅 Clase 3 (28 de Junio de 2026) — Modelos de Pensamientos Incorrectos</b></summary>\n\n* **Tema:** Reconocer nuestros modelos de pensamientos incorrectos.\n* **Video:** *\"Encontrar fuerza en el Señor\"* ([Ver en YouTube](https://youtu.be/1l0_3rNpb74)).\n</details>\n\n<details>\n<summary><b>📅 Clase 2 (21 de Junio de 2026) — La Gratitud y la Perspectiva</b></summary>\n\n* **Tema:** La gratitud y la perspectiva.\n* **Videos:** *\"La gratitud y la resiliencia\"* ([Ver en YouTube](https://youtu.be/KjGe00u0YvY)) y *\"Cómo cambiar la tristeza en gratitud\"* ([Ver en YouTube](https://youtu.be/kZL44-eQpD0)).\n</details>\n\n<details>\n<summary><b>📅 Clase 1 (14 de Junio de 2026) — Introducción a la Resiliencia Emocional</b></summary>\n\n* **Tema:** Introducción a la Resiliencia Emocional.\n* **Video:** *\"Está construyendo un palacio\"* ([Ver en Google Share](https://share.google/cN48ci8SlzsVF6r4d)).\n</details>\n\n---\n\n### 💬 Puntos para Platicar en Privado con la Hermana Alma\n*   **Plática sobre ITA y Periodismo:** Platicar acerca de ITA en cuanto al tema de periodismo y escuchar sus comentarios sinceros sobre cómo me ve y sus perspectivas.\n*   **Agradecimiento y Actualización:** Platicarle que el taller del martes en su estudio fue una excelente herramienta de relajación.\n*   **Evolución del Coraje:** Comentarle que noté un cambio en mi interior: ya no siento rabia ni rencor contra mi exesposa, solo una tristeza tranquila por la distancia con mis hijos.\n*   **Progreso de la Carta al Hijo:** Explicarle que me ha costado trabajo iniciar la carta por la carga emocional, pero que ya tengo la estrategia de empezar con frases cortas de amor sin exigirme perfección.\n*   **Cerrar la Duda de la Reunión en su Casa:** Expresarle abiertamente: *\"Hermana Alma, me quedé con una pequeña duda de la reunión que tuvimos en su casa con los élderes. Respondí de forma muy sincera a lo que me preguntaron, pero después me dio un poco de pena o duda de si habré dicho algo inadecuado o si incomodé a alguien. Quería comentárselo para estar tranquilo y no guardar nada.\"*\n\n---"}];

        let activeClassIndex = 0;
        const tabsBar = document.getElementById('tabs-bar');
        const contentContainer = document.getElementById('content-container');
        const searchBar = document.getElementById('search-bar');
        const emptyState = document.getElementById('empty-state');

        // Inicializar Pestañas
        function initTabs() {
            tabsBar.innerHTML = '';
            classesData.forEach((classObj, idx) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${idx === activeClassIndex ? 'active' : ''}`;
                btn.innerText = classObj.title;
                btn.onclick = () => selectTab(idx);
                tabsBar.appendChild(btn);
            });
            selectTab(activeClassIndex);
        }

        function selectTab(idx) {
            activeClassIndex = idx;
            document.querySelectorAll('.tab-btn').forEach((btn, bIdx) => {
                btn.classList.toggle('active', bIdx === idx);
            });
            searchBar.value = ''; // Limpiar buscador
            renderClassTopics();
            
            // Desplazar pestaña activa para asegurar visibilidad en móviles
            const activeBtn = tabsBar.children[idx];
            if (activeBtn) {
                activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        // Renderizar subtemas (Cards) de la clase activa
        function renderClassTopics(filteredCards = null) {
            contentContainer.innerHTML = '';
            const classObj = classesData[activeClassIndex];
            if (!classObj) return;

            // Si no hay filtro, parseamos todo
            const cards = filteredCards || parseSectionToCards(classObj.body);

            if (cards.length === 0) {
                emptyState.style.display = 'block';
                return;
            } else {
                emptyState.style.display = 'none';
            }

            cards.forEach((card, cIdx) => {
                const cardEl = document.createElement('div');
                cardEl.className = `topic-card ${card.isGeneral ? 'general-info' : ''}`;
                
                // Si es info general, la dejamos abierta por defecto y sin colapsar
                if (card.isGeneral) {
                    cardEl.innerHTML = `
                        <div class="card-content" style="padding-top: 20px;">
                            ${parseMarkdown(card.body)}
                        </div>
                    `;
                } else {
                    cardEl.innerHTML = `
                        <div class="card-header" onclick="toggleCard(this)">
                            <span class="card-title">${escapeHTML(card.title)}</span>
                            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                        <div class="card-body">
                            <div class="card-content">
                                ${parseMarkdown(card.body)}
                            </div>
                        </div>
                    `;
                }
                contentContainer.appendChild(cardEl);
            });
        }

        // Parser de Markdown super simple y offline
        function parseMarkdown(text) {
            let html = escapeHTML(text);
            
            // 1. Negrita: **texto**
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            // 2. Enlaces: [texto](url)
            html = html.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>');

            // 3. Checkboxes y Listas PRIMERO (procesar las viñetas '*' antes que la cursiva para no consumir el asterisco inicial de la lista)
            html = html.replace(/^\s*-\s+\[[xX]\]\s+(.*?)$/gm, '<div class="checkbox-item"><input type="checkbox" checked disabled> <span>$1</span></div>');
            html = html.replace(/^\s*-\s+\[ \]\s+(.*?)$/gm, '<div class="checkbox-item"><input type="checkbox" disabled> <span>$1</span></div>');
            html = html.replace(/^\s*-\s+(?!<div)(.*?)$/gm, '<li>$1</li>');
            html = html.replace(/^\s*\*\s+(?!<div)(.*?)$/gm, '<li>$1</li>');
            html = html.replace(/^\s*(\d+\.)\s+(.*?)$/gm, '<div class="list-item-numbered"><strong>$1</strong> $2</div>');

            // 4. Cursiva: *texto* (segura una vez consumido el asterisco de viñeta)
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            
            // 5. Subtítulos ### texto y #### texto
            html = html.replace(/^###\s+(.*?)$/gm, '<h3>$1</h3>');
            html = html.replace(/^####\s+(.*?)$/gm, '<h4>$1</h4>');

            // Restore details and summary tags from escaping
            html = html.replace(/&lt;details&gt;/g, '<details>');
            html = html.replace(/&lt;\/details&gt;/g, '</details>');
            html = html.replace(/&lt;summary&gt;/g, '<summary>');
            html = html.replace(/&lt;\/summary&gt;/g, '</summary>');
            html = html.replace(/&lt;b&gt;/g, '<b>');
            html = html.replace(/&lt;\/b&gt;/g, '</b>');
            
            // Eliminar saltos de línea inmediatamente después de elementos de bloque
            html = html.replace(/(<\/li>|<\/div>|<\/h3>|<\/h4>|<\/blockquote>)\s*\n/g, '$1');

            // Saltos de línea restantes a <br>
            html = html.replace(/\n/g, '<br>');
            
            return html;
        }

        // Parser del cuerpo para extraer subsecciones basadas en "### "
        function parseSectionToCards(bodyText) {
            // Dividir el texto usando "### " como separador
            const parts = bodyText.split(/^###\s+/m);
            const cards = [];

            // El primer elemento es texto libre antes de cualquier "### " (si existe)
            const generalText = parts[0].trim();
            if (generalText && generalText !== '*(Espacio para notas...)*') {
                cards.push({
                    title: "Información General",
                    body: generalText,
                    isGeneral: true
                });
            }

            for (let i = 1; i < parts.length; i++) {
                const lines = parts[i].split('\n');
                const title = lines[0].trim();
                const body = lines.slice(1).join('\n').trim();
                if (title) {
                    cards.push({
                        title: title,
                        body: body,
                        isGeneral: false
                    });
                }
            }
            return cards;
        }

        function toggleCard(headerElement) {
            const card = headerElement.parentElement;
            const body = card.querySelector('.card-body');
            
            document.querySelectorAll('.topic-card.expanded').forEach(openCard => {
                if (openCard !== card) {
                    openCard.classList.remove('expanded');
                    openCard.querySelector('.card-body').style.maxHeight = null;
                }
            });

            if (card.classList.contains('expanded')) {
                body.style.maxHeight = body.scrollHeight + "px";
                body.offsetHeight; // force reflow
                card.classList.remove('expanded');
                body.style.maxHeight = null;
            } else {
                card.classList.add('expanded');
                body.style.maxHeight = body.scrollHeight + "px";
                const onTransitionEnd = () => {
                    if (card.classList.contains('expanded')) {
                        body.style.maxHeight = 'none';
                    }
                    body.removeEventListener('transitionend', onTransitionEnd);
                };
                body.addEventListener('transitionend', onTransitionEnd);
                setTimeout(() => {
                    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 300);
            }
        }

        // Buscador reactivo dentro de la pestaña activa
        searchBar.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            const classObj = classesData[activeClassIndex];
            if (!classObj) return;

            const allCards = parseSectionToCards(classObj.body);
            if (query === '') {
                renderClassTopics(allCards);
                return;
            }

            const filtered = allCards.filter(card => {
                const normTitle = card.title.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                const normBody = card.body.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                return normTitle.includes(query) || normBody.includes(query);
            });
            renderClassTopics(filtered);
        });

        function escapeHTML(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Iniciar
        initTabs();
    </script>
</body>
