<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VROMLIX | Mis Apuntes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: hsl(230, 20%, 6%);
            --bg-card: hsla(230, 20%, 12%, 0.45);
            --bg-card-hover: hsla(230, 20%, 16%, 0.6);
            --border-color: hsla(230, 20%, 30%, 0.15);
            --border-hover: hsla(230, 20%, 50%, 0.3);
            --accent-primary: hsl(190, 100%, 50%); /* Neon Cyan */
            --accent-secondary: hsl(270, 95%, 65%); /* Neon Purple */
            --accent-success: hsl(145, 80%, 45%); /* Emerald Green */
            
            --font-sans: 'Outfit', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --grad-text: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            --grad-glow: radial-gradient(circle at 50% -20%, hsla(190, 100%, 50%, 0.15), transparent 70%);
            
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: var(--grad-glow);
            background-attachment: fixed;
            color: hsl(220, 15%, 85%);
            font-family: var(--font-sans);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 80px;
        }

        .app-container {
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: var(--grad-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .subtitle {
            font-size: 0.85rem;
            color: hsl(220, 10%, 60%);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Buscador */
        .search-wrapper {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 12px 18px;
            font-size: 0.95rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: hsla(230, 20%, 10%, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: #fff;
            outline: none;
            transition: var(--transition-normal);
        }

        .search-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 12px hsla(190, 100%, 50%, 0.15);
        }

        /* Contenedor Fijo para Navegación Móvil y Desktop */
        .sticky-header-container {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-dark);
            padding-top: 10px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            margin-left: -20px;
            margin-right: -20px;
            padding-left: 20px;
            padding-right: 20px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            margin-bottom: 20px;
        }

        /* Selector de Clases (Tabs Horizontales con Scrollbar Oculto) */
        .tabs-container {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding-bottom: 12px;
            margin-bottom: 0;
            scrollbar-width: none; /* Firefox */
        }

        .tabs-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        @media (min-width: 600px) {
            .tabs-container {
                flex-wrap: wrap;
                overflow-x: visible;
            }
        }

        .tab-btn {
            flex: 0 0 auto;
            padding: 10px 18px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: hsl(220, 10%, 75%);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-normal);
        }

        .tab-btn:active {
            transform: scale(0.97);
        }

        .tab-btn.active {
            background: var(--grad-text);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 15px hsla(270, 95%, 65%, 0.25);
        }

        /* Contenido de la Clase Activa */
        .class-content-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Tarjeta de Tema (Card) */
        .topic-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: var(--transition-normal);
        }

        .topic-card.general-info {
            background: linear-gradient(135deg, hsla(190, 100%, 50%, 0.05), hsla(270, 95%, 65%, 0.03));
            border-color: hsla(190, 100%, 50%, 0.15);
        }

        .card-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .card-title {
            font-size: 1.12rem;
            font-weight: 600;
            color: hsl(220, 15%, 95%);
            transition: var(--transition-normal);
        }

        .topic-card.expanded .card-title {
            color: var(--accent-primary);
        }

        .chevron {
            width: 16px;
            height: 16px;
            color: hsl(220, 10%, 50%);
            transition: transform var(--transition-normal);
        }

        .topic-card.expanded .chevron {
            transform: rotate(180deg);
            color: var(--accent-primary);
        }

        .card-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height var(--transition-normal);
        }

        .card-content {
            padding: 0 20px 20px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 15px;
            font-size: 1.05rem;
            color: hsl(220, 10%, 92%);
        }

        /* Estilos Markdown Parseado */
        .card-content h3 {
            font-size: 1.15rem;
            margin-bottom: 10px;
            color: var(--accent-primary);
            border-left: 3px solid var(--accent-primary);
            padding-left: 10px;
            margin-top: 18px;
        }

        .card-content h3:first-child {
            margin-top: 0;
        }

        .card-content li,
        .card-content .list-item-numbered {
            margin-left: 20px;
            margin-bottom: 6px;
            font-size: 1.05rem;
            color: hsl(220, 10%, 92%);
            line-height: 1.5;
        }

        .card-content strong {
            color: #fff;
        }

        .card-content a {
            color: var(--accent-primary);
            text-decoration: none;
            border-bottom: 1px dotted var(--accent-primary);
        }

        /* Checkbox */
        .checkbox-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 1.05rem;
            line-height: 1.5;
        }

        .checkbox-item input[type="checkbox"] {
            margin-top: 5px;
            accent-color: var(--accent-primary);
            width: 16px;
            height: 16px;
        }

        .checkbox-item span {
            color: hsl(220, 10%, 92%);
        }

        .checkbox-item input[type="checkbox"]:checked + span {
            text-decoration: line-through;
            color: hsl(220, 10%, 50%);
        }

        /* Estilos para detalles colapsables (details/summary) */
        details {
            background: hsla(230, 20%, 15%, 0.3);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            margin: 8px 0;
            transition: var(--transition-normal);
        }

        details[open] {
            border-color: hsla(190, 100%, 50%, 0.3);
            background: hsla(230, 20%, 18%, 0.4);
        }

        summary {
            font-weight: 600;
            color: hsl(220, 15%, 95%);
            cursor: pointer;
            outline: none;
            user-select: none;
            transition: var(--transition-normal);
        }

        summary:hover {
            color: var(--accent-primary);
        }

        details p {
            margin-top: 10px;
            font-size: 0.95rem;
            color: hsl(220, 10%, 80%);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: hsl(220, 10%, 50%);
            font-size: 0.95rem;
            display: none;
        }

        .footer-info {
            text-align: center;
            font-size: 0.75rem;
            color: hsl(220, 10%, 40%);
            margin-top: 40px;
        }
    </style>
</head>

    <script>

timiento sincero, Él puede dejar nuestra alma blanca como la nieve. Nos enseña que la gracia de Cristo no solo cubre faltas, sino que regenera nuestro corazón para volver a empezar sin culpa.\"*\n\n* **Pregunta 2: ¿Por qué Isaías describe al Templo como 'el monte de Jehová' y qué significa subir a él en nuestros días?**\n  > **💬 Respuesta Preparada para Leer/Comentar en Clase:**  \n  > *\"Subir al monte siempre requiere esfuerzo y dejar atrás el ruido del valle. Ir al templo o prepararnos para tener nuestra recomendación es elevarnos espiritualmente sobre el estrés del mundo para recibir la instrucción directa del Señor y renovar nuestros convenios de paz.\"*\n\n---\n\n### 📅 Historial de Clases Pasadas\n\n<details>\n<summary><b>📅 Domingo 13 de Septiembre de 2026 — Proverbios 1–4; 15; 22; 31; Eclesiastés 1–3</b></summary>\n\n* **Tema:** *\"El principio de la sabiduría es el temor de Jehová\"* (Se acordó unirse toda la clase en el Salón Sacramental).\n* **Punto central:** El \"temor de Jehová\" como reverencia y amor devoto a Dios.\n</details>\n\n---"}, {"title": "Fundamentos del Evangelio", "body": "*(Domingos 11:00 am — Primeros 25 min / Salón de Miembros Nuevos y Amigos)*\n* **Maestro / Facilitador:** Hno. Enrique Leyva\n\n### 📅 Preparación para la Próxima Clase: Domingo 20 de Septiembre de 2026 — 🟢 CLASE PRÓXIMA\n\n* **Grupo de WhatsApp:** *Esc. Dominical miembros nuevos y amigos de la Iglesia*\n* **Tema Asignado:** **Lección 6: \"La Oración Sincera y el Estudio Diario de las Escrituras\"**\n* **Manual Oficial:** [Estudiar Lección 6 en ChurchofJesusChrist.org](https://www.churchofjesuschrist.org/study/manual/gospel-foundations-digital-resource/06?lang=spa)\n\n---\n\n#### 💡 1. Resumen de la Lección y Principios Clave\n* **La Oración como Línea Directa con el Padre Celestial:** Orar no es recitar palabras de memoria, sino una conversación sincera de hijo a Padre donde compartimos nuestras gratitudes, dudas y necesidades reales.\n* **Las Escrituras como Respuesta a O ilia de amigos.\n4. **Invitación:** Invitar a la reunión sacramental de las 10:00 am.\n\n---"}, {"title": "Psicología", "body": "*(Sesiones Terapéuticas — Facultad de Psicología BUAP)*\n* **Horario Fijo:** Jueves a las 3:00 pm | **Terapeuta:** Javier\n\n### 🧠 Factores y Análisis de Gaslighting\n* **Factores Aumentadores (Suben a 9-10):** Rutina física, oración, logros técnicos y buena comunicación.\n* **Factores Reductores (Bajan a 4-5):** Cansancio, incertidumbre económica y discusiones.\n* **5 Ejemplos Reales de Gaslighting (Análisis de Biografía):**\n  1. Invalidación de la reconexión con el primogénito.\n  2. Monopolio de la narrativa moral (*\"Primero perdónate a ti mismo\"*).\n  3. Confesiones preventivas para desactivar respuesta emocional.\n  4. Triangulación de control social con intermediarios.\n  5. Frialdad materna intermitente y descalificación."}, {"title": "Quórum de Élderes", "body": "*(Domingos 1:00 pm — Salón de Quórum de Élderes / Capilla)*\n* **Presidente de Quórum:** Stalin Mijail Los De Los Santos\n\n### 📅 Preparación para la Próxima Clase: Domingo 20 de Septiembre de 2026 — 🟢 CLASE PRÓXIMA\n\n* **Fuente Oficial:** Discurso de Conferencia General / Principios Doctrina y Convenios — **\"La Ley del Diezmo, la Honestidad y la Consagración\"** (Malaquías 3:10 & D. y C. 119).\n* **Tema Principal:** *\"Abrir las ventanas de los cielos mediante la obediencia a la Ley del Diezmo y la Autosuficiencia\"*\n\n---\n\n#### 📋 Pendientes Específicos con el Pdte. Stalin Mijail:\n1. **Oportunidad Laboral con Don Alfredo:** Preguntarle al Pdte. Stalin sobre Don Alfredo y dar seguimiento a opciones de trabajo.\n2. **Entrevista de Bendición Patriarcal:** Coordinar cita con el Obispo para obtener la recomendación y agendar con el Patriarca Martínez.\n\n---\n\n#### 💡 1. Resumen del Tema y Principios Doctrinales\n* **La Promesa de Malaquías 3:10:** Pagar el diezmo no es una transacción financiera; es un acto de fe. El Señor promete abrir las ventanas de los cielos y derramar bendiciones temporales y espirituales hasta que sobreabunde.\n* **Honestidad e Integridad Financiera:** Pagar un diezmo íntegro demuestra nuestra prioridad espiritual y nos enseña a administrar los recursos con sabiduría y autosuficiencia.\n\n---\n\n#### 💬 Respuestas y Comentarios Preparados para Levantar la Mano y Participar\n\n* **Pregunta 1: ¿Por qué la Ley del Diezmo es más una ley de fe y protección espiritual que un asunto de dinero?**\n  > **💬 Respuesta Preparada para Leer/Comentar en Clase:**  \n  > *\"Presidente Stalin, cuando pagamos el diezmo en momentos donde el presupuesto es estrecho, le estamos demostrando al Señor que confiamos en Su promesa antes que en nuestras propias fuerzas. Las ventanas de los cielos no solo se abren con bendiciones económicas, sino con claridad mental, paz en el hogar y sabiduría para administrar lo que tenemos.\"*\n\n* **Pregunta 2: ¿Cómo ayuda la obediencia al diezmo a edificar nuestro carácter como poseedores del sacerdocio?**\n  > **💬 Respuesta Preparada para Leer/Comentar en Clase:**  \n  > *\"Nos enseña disciplina, gratitud y desapego. Al poner al Señor en primer lugar cada mes, aprendemos a ser buenos administradores de las bendiciones que Él nos da.\"*\n\n---\n\n### 📅 Historial de Clases Pasadas\n\n<details>\n<summary><b>📅 Domingo 13 de Septiembre de 2026 — \"Sigue al profeta\" (Élder Teh)</b></summary>\n\n* **Tema:** Obediencia activa al profeta de Dios y fortaleza del sacerdocio en el hogar.\n</details>\n\n---"}, {"title": "Resiliencia Emocional", "body": "*(Domingos 12:30 pm — Biblioteca / Salón del Sumo Consejo)*\n* **Facilitadora:** Hna. Alma Luis\n\n### 📅 Preparación para la Próxima Clase: Domingo 20 de Septiembre de 2026 — 🟢 CLASE PRÓXIMA\n\n* **Facilitadora:** Hna. Alma Luis\n* **Compañeros de Acción Asignados:** **Roger y Hno. Roger Morales**\n* **Tema Principal:** **\"Manejo del Estrés, Control de Pensamientos y Hábitos Saludables\"**\n* **Video de Reflexión:** 🔗 [Ver Video de Resiliencia en YouTube](https://youtu.be/c7EOipDUEgc)\n\n---\n\n#### 📝 Tareas y Asignaciones Semanales con el Compañero de Acción\n1. **Contacto con Hno. Roger Morales:** Mantener comunicación activa para revisar metas diarias y apoyo mutuo.\n2. **Plática con Hna. Alma:** Escuchar sus comentarios en privado acerca de ITA (periodismo) y el perfil profesional.\n\n---\n\n#### 💡 1. Resumen de Herramientas y Psicología Emocional\n* **Reemplazar Modelos de Pensamiento Distorsionado:** Identificar pensamientos de \"todo o nada\" o catastrofismo y filtrarlos mediante la lógica y la fe en Cristo.\n* **Cuidado Integral:** Dormir adecuadamente, rutina de sol/ejercicio matutino y la oración constante como anclas contra la fatiga mental.\n\n---\n\n#### 💬 Respuestas y Comentarios Preparados para Levantar la Mano y Participar\n\n* **Pregunta 1: ¿Cómo nos ayuda la fe en Jesucristo a cambiar pensamientos de abrumamiento o cansancio por serenidad?**\n  > **💬 Respuesta Preparada para Leer/Comentar en Clase:**  \n  > *\"Hermana Alma, cuando la mente se abruma por el cansancio o la incertidumbre, la fe nos permite hacer una pausa y recordar que no tenemos que cargar todo solos hoy. El Señor nos invita a tomar Su yugo, lo que significa avanzar paso a paso sabiendo que Él complementa nuestros esfuerzos.\"*\n\n---\n\n### 📅 Historial de Clases Pasadas\n\n<details>\n<summary><b>📅 Domingo 13 de Septiembre de 2026 — Asignación de Compañeros de Acción</b></summary>\n\n* **Compañero de acción asignado:** Hno. Roger Morales.\n</details>\n\n---"}];

        let activeClassIndex = 0;
        const tabsBar = document.getElementById('tabs-bar');
        const contentContainer = document.getElementById('content-container');
        const searchBar = document.getElementById('search-bar');
        const emptyState = document.getElementById('empty-state');

        // Inicializar Pestañas
        function initTabs() {
            tabsBar.innerHTML = '';
            classesData.forEach((classObj, idx) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${idx === activeClassIndex ? 'active' : ''}`;
                btn.innerText = classObj.title;
                btn.onclick = () => selectTab(idx);
                tabsBar.appendChild(btn);
            });
            selectTab(activeClassIndex);
        }

        function selectTab(idx) {
            activeClassIndex = idx;
            document.querySelectorAll('.tab-btn').forEach((btn, bIdx) => {
                btn.classList.toggle('active', bIdx === idx);
            });
            searchBar.value = ''; // Limpiar buscador
            renderClassTopics();
            
            // Desplazar pestaña activa para asegurar visibilidad en móviles
            const activeBtn = tabsBar.children[idx];
            if (activeBtn) {
                activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        // Renderizar subtemas (Cards) de la clase activa
        function renderClassTopics(filteredCards = null) {
            contentContainer.innerHTML = '';
            const classObj = classesData[activeClassIndex];
            if (!classObj) return;

            // Si no hay filtro, parseamos todo
            const cards = filteredCards || parseSectionToCards(classObj.body);

            if (cards.length === 0) {
                emptyState.style.display = 'block';
                return;
            } else {
                emptyState.style.display = 'none';
            }

            cards.forEach((card, cIdx) => {
                const cardEl = document.createElement('div');
                cardEl.className = `topic-card ${card.isGeneral ? 'general-info' : ''}`;
                
                // Si es info general, la dejamos abierta por defecto y sin colapsar
                if (card.isGeneral) {
                    cardEl.innerHTML = `
                        <div class="card-content" style="padding-top: 20px;">
                            ${parseMarkdown(card.body)}
                        </div>
                    `;
                } else {
                    cardEl.innerHTML = `
                        <div class="card-header" onclick="toggleCard(this)">
                            <span class="card-title">${escapeHTML(card.title)}</span>
                            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                        <div class="card-body">
                            <div class="card-content">
                                ${parseMarkdown(card.body)}
                            </div>
                        </div>
                    `;
                }
                contentContainer.appendChild(cardEl);
            });
        }

        // Parser de Markdown super simple y offline
        function parseMarkdown(text) {
            let html = escapeHTML(text);
            
            // 1. Negrita: **texto**
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            // 2. Enlaces: [texto](url)
            html = html.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>');

            // 3. Checkboxes y Listas PRIMERO (procesar las viñetas '*' antes que la cursiva para no consumir el asterisco inicial de la lista)
            html = html.replace(/^\s*-\s+\[[xX]\]\s+(.*?)$/gm, '<div class="checkbox-item"><input type="checkbox" checked disabled> <span>$1</span></div>');
            html = html.replace(/^\s*-\s+\[ \]\s+(.*?)$/gm, '<div class="checkbox-item"><input type="checkbox" disabled> <span>$1</span></div>');
            html = html.replace(/^\s*-\s+(?!<div)(.*?)$/gm, '<li>$1</li>');
            html = html.replace(/^\s*\*\s+(?!<div)(.*?)$/gm, '<li>$1</li>');
            html = html.replace(/^\s*(\d+\.)\s+(.*?)$/gm, '<div class="list-item-numbered"><strong>$1</strong> $2</div>');

            // 4. Cursiva: *texto* (segura una vez consumido el asterisco de viñeta)
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            
            // 5. Subtítulos ### texto y #### texto
            html = html.replace(/^###\s+(.*?)$/gm, '<h3>$1</h3>');
            html = html.replace(/^####\s+(.*?)$/gm, '<h4>$1</h4>');

            // Restore details and summary tags from escaping
            html = html.replace(/&lt;details&gt;/g, '<details>');
            html = html.replace(/&lt;\/details&gt;/g, '</details>');
            html = html.replace(/&lt;summary&gt;/g, '<summary>');
            html = html.replace(/&lt;\/summary&gt;/g, '</summary>');
            html = html.replace(/&lt;b&gt;/g, '<b>');
            html = html.replace(/&lt;\/b&gt;/g, '</b>');
            
            // Eliminar saltos de línea inmediatamente después de elementos de bloque
            html = html.replace(/(<\/li>|<\/div>|<\/h3>|<\/h4>|<\/blockquote>)\s*\n/g, '$1');

            // Saltos de línea restantes a <br>
            html = html.replace(/\n/g, '<br>');
            
            return html;
        }

        // Parser del cuerpo para extraer subsecciones basadas en "### "
        function parseSectionToCards(bodyText) {
            // Dividir el texto usando "### " como separador
            const parts = bodyText.split(/^###\s+/m);
            const cards = [];

            // El primer elemento es texto libre antes de cualquier "### " (si existe)
            const generalText = parts[0].trim();
            if (generalText && generalText !== '*(Espacio para notas...)*') {
                cards.push({
                    title: "Información General",
                    body: generalText,
                    isGeneral: true
                });
            }

            for (let i = 1; i < parts.length; i++) {
                const lines = parts[i].split('\n');
                const title = lines[0].trim();
                const body = lines.slice(1).join('\n').trim();
                if (title) {
                    cards.push({
                        title: title,
                        body: body,
                        isGeneral: false
                    });
                }
            }
            return cards;
        }

        function toggleCard(headerElement) {
            const card = headerElement.parentElement;
            const body = card.querySelector('.card-body');
            
            document.querySelectorAll('.topic-card.expanded').forEach(openCard => {
                if (openCard !== card) {
                    openCard.classList.remove('expanded');
                    openCard.querySelector('.card-body').style.maxHeight = null;
                }
            });

            if (card.classList.contains('expanded')) {
                body.style.maxHeight = body.scrollHeight + "px";
                body.offsetHeight; // force reflow
                card.classList.remove('expanded');
                body.style.maxHeight = null;
            } else {
                card.classList.add('expanded');
                body.style.maxHeight = body.scrollHeight + "px";
                const onTransitionEnd = () => {
                    if (card.classList.contains('expanded')) {
                        body.style.maxHeight = 'none';
                    }
                    body.removeEventListener('transitionend', onTransitionEnd);
                };
                body.addEventListener('transitionend', onTransitionEnd);
                setTimeout(() => {
                    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 300);
            }
        }

        // Buscador reactivo dentro de la pestaña activa
        searchBar.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            const classObj = classesData[activeClassIndex];
            if (!classObj) return;

            const allCards = parseSectionToCards(classObj.body);
            if (query === '') {
                renderClassTopics(allCards);
                return;
            }

            const filtered = allCards.filter(card => {
                const normTitle = card.title.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                const normBody = card.body.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                return normTitle.includes(query) || normBody.includes(query);
            });
            renderClassTopics(filtered);
        });

        function escapeHTML(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Iniciar
        initTabs();
    </script>
</body>
</html>
